name: Repair studio privacy test and redeploy
on:
  push:
    branches: [main]
    paths: [.github/workflows/studio-privacy-test-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: freedom-arkives-publishing
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make the browser test use the existing privacy dialog
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/studio-gallery.yml')
          text=p.read_text()
          indent=' '*18
          old=indent+"page.goto('http://127.0.0.1:8765/',wait_until='networkidle');page.wait_for_selector('.fa-showcase');assert page.locator('.pom-spatial-bg').count()==1"
          new='\n'.join([indent+"page.goto('http://127.0.0.1:8765/',wait_until='networkidle')",indent+"page.get_by_role('button',name='Reject optional',exact=True).click()",indent+"page.locator('.fa-privacy-shade').wait_for(state='detached')",indent+"assert page.evaluate(\"JSON.parse(localStorage.getItem('fa.privacy.v1')).externalMedia===false\")",indent+"page.wait_for_selector('.fa-showcase');assert page.locator('.pom-spatial-bg').count()==1"])
          if old in text:
              assert text.count(old)==1
              text=text.replace(old,new,1)
              p.write_text(text)
          else:
              assert new in text,'Unexpected test source; stop without changing anything'
      - name: Commit only the test setup repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/studio-gallery.yml
          git diff --cached --quiet || git commit -m "Handle first-visit privacy choice before gallery browser checks"
          git push origin HEAD:main
      - name: Run the existing test-gated deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,urllib.request
          url='https://api.github.com/repos/pomegranatexlily/freedom-arkives/actions/workflows/studio-gallery.yml/dispatches'
          req=urllib.request.Request(url,data=json.dumps({'ref':'main'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response:
              assert response.status==204
