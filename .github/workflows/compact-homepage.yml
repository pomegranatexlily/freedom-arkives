name: Split and compact Freedom Arkives homepage
on:
  push:
    branches: [main]
    paths:
      - scripts/split_homepage.py
      - scripts/publish_home_polish.py
      - scripts/add_brownie_wars.py
      - app-navigation.js
      - app-navigation.css
      - privacy-consent.js
      - assets/fonts/**
      - reader/**
      - .github/workflows/compact-homepage.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: freedom-arkives-publishing
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore original iPhone Home Screen artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          artwork = Path("assets/fa-icon.jpg")
          if not artwork.is_file():
              raise SystemExit("Original icon artwork is missing; no changes made")
          old = '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />'
          restored = '<link rel="apple-touch-icon" href="assets/fa-icon.jpg" />'
          text = page.read_text(encoding="utf-8")
          if text.count(old) == 1:
              page.write_text(text.replace(old, restored, 1), encoding="utf-8")
          elif text.count(restored) != 1:
              raise SystemExit("Unexpected Apple icon markup; no changes made")
          PY
      - name: Add the screenshot-confirmed fourteenth book
        run: python3 scripts/add_brownie_wars.py
      - name: Apply approved homepage polish and package licensed font
        run: python3 scripts/publish_home_polish.py
      - name: Integrate reader menu link and offline resources
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          nav = Path("app-navigation.js")
          text = nav.read_text(encoding="utf-8")
          marker = "    slot.appendChild(menu);"
          link = '    var readerLink = document.createElement("a"); readerLink.href = "reader/"; readerLink.textContent = "Read & Listen"; list.appendChild(readerLink);'
          if link not in text:
              if text.count(marker) != 1:
                  raise SystemExit("Unexpected menu structure; no menu changes made")
              text = text.replace(marker, link + "\n" + marker, 1)
          nav.write_text(text, encoding="utf-8")
          worker = Path("sw.js")
          text = worker.read_text(encoding="utf-8")
          for name, additions in [("SHELL_PAGES", ["reader/"]), ("SHELL_ASSETS", ["reader/reader.css", "reader/reader.js"])]:
              pattern = r"const " + name + r" = \[(.*?)\];"
              match = re.search(pattern, text, re.S)
              if not match:
                  raise SystemExit("Missing offline cache declaration")
              entries = list(dict.fromkeys(json.loads("[" + match.group(1) + "]") + additions))
              text = text[:match.start()] + "const " + name + " = " + json.dumps(entries, indent=2) + ";" + text[match.end():]
          worker.write_text(text, encoding="utf-8")
          PY
      - name: Extract resources and verify publication preservation
        run: python3 scripts/split_homepage.py
      - name: Check JavaScript syntax
        run: |
          node --check app-navigation.js
          node --check reader/reader.js
          node --check reader/book-previews.js
          node scripts/test_reader_previews.js
          for file in homepage-script-*.js; do
            [ ! -f "$file" ] || node --check "$file"
          done
      - name: Publish generated files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js assets/extracted assets/fonts app-navigation.js app-navigation.css privacy-consent.js
          find . -maxdepth 1 -type f \( -name 'homepage-style-*.css' -o -name 'homepage-script-*.js' \) -exec git add -- {} +
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved Schibsted homepage controls and refreshed assets"
            git push origin HEAD:main
          fi
      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy generated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
