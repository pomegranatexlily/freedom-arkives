name: Sync Medium articles
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: freedom-arkives-publishing
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Run article sync and keep homepage split
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-articles.py | tee sync.log
          python3 scripts/split_homepage.py
          node --check app-navigation.js
          for file in homepage-script-*.js; do
            [ ! -f "$file" ] || node --check "$file"
          done
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js assets/extracted
          find . -maxdepth 1 -type f \( -name 'homepage-style-*.css' -o -name 'homepage-script-*.js' \) -exec git add -- {} +
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync Medium articles and preserve compact homepage"
            git push origin HEAD:main
          fi
      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy generated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
