name: Diagnose studio deployment failure
on:
  push:
    branches: [main]
    paths: [.github/workflows/studio-deploy-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the specific failed deployment run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,os,urllib.request,urllib.error
          from pathlib import Path
          base='https://api.github.com/repos/pomegranatexlily/freedom-arkives/'
          def api(path):
              url=path if path.startswith('https://') else base+path
              assert url.startswith(base)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              return json.load(urllib.request.urlopen(req,timeout=30))
          run=api('actions/runs/40656558392')
          jobs=api('actions/runs/40656558392/jobs?per_page=100')
          report={'run':{'id':run['id'],'status':run['status'],'conclusion':run['conclusion'],'url':run['html_url']},'jobs':[]}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          for job in jobs['jobs']:
              entry={'name':job['name'],'conclusion':job['conclusion'],'steps':job.get('steps',[])}
              try:
                  check=api(job['check_run_url'])
                  entry['check_output']=check.get('output',{})
                  annotation_url=check.get('output',{}).get('annotations_url')
                  if annotation_url:entry['annotations']=api(annotation_url)
              except Exception as e:entry['annotation_error']=str(e)
              try:
                  url=base+'actions/jobs/'+str(job['id'])+'/logs'
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  try:
                      response=urllib.request.build_opener(NoRedirect()).open(req,timeout=30)
                      raw=response.read()
                  except urllib.error.HTTPError as e:
                      if e.code!=302:raise
                      target=e.headers['Location'];assert target.startswith('https://')
                      raw=urllib.request.urlopen(target,timeout=30).read()
                  entry['log_tail']=raw.decode('utf-8',errors='replace')[-20000:]
              except Exception as e:entry['log_error']=str(e)
              report['jobs'].append(entry)
          Path('health').mkdir(exist_ok=True)
          Path('health/studio-deploy-diagnostics.json').write_text(json.dumps(report,indent=2))
      - name: Commit diagnostic report only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health/studio-deploy-diagnostics.json
          git diff --cached --quiet || git commit -m "Record failed studio deployment diagnostics"
          git push origin HEAD:main
