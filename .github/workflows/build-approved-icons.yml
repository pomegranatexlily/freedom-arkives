name: Build approved Freedom Arkives poster icons
on:
  push:
    paths:
      - 'assets/arkives-poster-icon-source.jpg'
      - 'scripts/build_approved_icon.py'
      - '.github/workflows/build-approved-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/build_approved_icon.py
      - name: Commit verified icon sizes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon-32.png apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: apply approved poster icon [skip ci]'
            git push
          fi
