name: Publish Freedom Arkives Living Collection
on:
  push:
    branches: [main]
    paths: [.github/workflows/living-collection-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: freedom-arkives-publishing
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: python -m pip install PyYAML==6.0.2 playwright==1.51.0
      - name: Apply approved environment and test preserved gallery
        id: build
        shell: python
        run: |
          ENVIRONMENT=r"""/* Freedom Arkives Living Collection environment v1; original gallery retained below. */
          (function(){'use strict';
          function init(){
          if(document.querySelector('.fa-archive-bg'))return;
          var scene=document.createElement('div');scene.className='pom-spatial-bg fa-archive-bg';scene.setAttribute('aria-hidden','true');
          var world=document.createElement('div');world.className='fa-archive-world';scene.append(world);
          ['fa-archive-grain','fa-archive-folio one','fa-archive-folio two','fa-archive-folio three','fa-archive-light'].forEach(function(name){var n=document.createElement('div');n.className=name;world.append(n);});
          document.body.prepend(scene);document.body.classList.add('pom-spatial','fa-living-collection');
          var reduced=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(hover: hover) and (pointer: fine)'),frame=0,x=0,y=0;
          function paint(){frame=0;scene.dataset.motion=reduced.matches?'off':'on';scene.dataset.view=location.hash.slice(1)||'home';scene.style.setProperty('--px',(reduced.matches?0:x).toFixed(1)+'px');scene.style.setProperty('--py',(reduced.matches?0:y).toFixed(1)+'px');}
          function schedule(){if(!document.hidden&&!frame)frame=requestAnimationFrame(paint);}
          document.addEventListener('pointermove',function(e){if(reduced.matches||!fine.matches||e.pointerType!=='mouse')return;x=(e.clientX/innerWidth-.5)*12;y=(e.clientY/innerHeight-.5)*8;schedule();},{passive:true});
          document.documentElement.addEventListener('pointerleave',function(){x=0;y=0;schedule();});window.addEventListener('hashchange',schedule);document.addEventListener('visibilitychange',function(){if(document.hidden&&frame){cancelAnimationFrame(frame);frame=0;}else schedule();});
          if(reduced.addEventListener)reduced.addEventListener('change',schedule);else reduced.addListener(schedule);paint();
          function icon(path){var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');svg.classList.add('fa-ui-icon');var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);svg.append(p);return svg;}
          function decorate(){
          document.querySelectorAll('.fa-deck-controls button').forEach(function(b){if(b.querySelector('svg'))return;var previous=(b.getAttribute('aria-label')||'').indexOf('Previous')===0;b.replaceChildren(icon(previous?'M15 5l-7 7 7 7':'M9 5l7 7-7 7'));});
          document.querySelectorAll('.capacity .plus').forEach(function(n){if(!n.querySelector('svg'))n.replaceChildren(icon('M12 5v14M5 12h14'));});
          document.querySelectorAll('a,button').forEach(function(root){var walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[],n;while((n=walk.nextNode()))nodes.push(n);nodes.forEach(function(t){if(t.parentElement&&t.parentElement.closest('h1,h2,h3,p,blockquote,code'))return;var clean=t.nodeValue.replace(/[\u2190-\u21ff\u2600-\u27bf\u{1f000}-\u{1faff}\ufe0f\u200d]/gu,'');if(clean!==t.nodeValue)t.nodeValue=clean;});});
          }
          var pending=false;new MutationObserver(function(){if(pending)return;pending=true;requestAnimationFrame(function(){pending=false;decorate();});}).observe(document.body,{childList:true,subtree:true});decorate();
          }
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();
          """
          OVERRIDES=r"""
          /* Freedom Arkives approved Living Collection palette and original folio environment. */
          html.fa-section-navigation{color-scheme:dark;--fa-archive-depth:#081C17;--fa-forest-surface:#142B21;--fa-folio-layer:#254B36;--fa-parchment:#EFE9DA;--fa-sage-ink:#A6B5A4;--fa-copper:#C29566;--fa-warm-brass:#D2B98D;--fa-quiet-divider:#3D5B49;--fa-control-edge:#7F947F;--fa-focus-light:#E3B988;--paper:var(--fa-archive-depth);--paper-2:var(--fa-forest-surface);--ink:var(--fa-parchment);--muted:var(--fa-sage-ink);--line:var(--fa-quiet-divider);--strong-line:var(--fa-control-edge);--copper:var(--fa-copper);--copper-dark:var(--fa-focus-light);--green:#A7BD98;--crimson:#D99A94;--white:var(--fa-forest-surface);--shadow:0 18px 46px #0006}
          body.fa-living-collection{background:var(--fa-archive-depth);color:var(--fa-parchment);isolation:isolate}
          .fa-archive-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;user-select:none;contain:strict;perspective:1100px;--px:0px;--py:0px;background:radial-gradient(ellipse at 80% 35%,#254B3666,transparent 58%),radial-gradient(ellipse at 10% 100%,#C2956612,transparent 45%),#081C17}
          .fa-archive-world{position:absolute;inset:-3%;transform-style:preserve-3d;transform:translate3d(var(--px),var(--py),0);transition:transform .55s ease-out}
          .fa-archive-grain{position:absolute;inset:0;background:radial-gradient(#C2956626 .7px,transparent .7px);background-size:29px 29px;opacity:.32}
          .fa-archive-folio{position:absolute;right:-12%;top:7%;width:68vw;min-width:570px;height:64vh;min-height:430px;border:1px solid #C295663b;border-radius:8px;background:linear-gradient(120deg,#254B3618,#C2956609);box-shadow:inset 1px 1px #D2B98D12;transform:translateZ(-160px) rotateZ(-27deg) skewY(12deg);transform-origin:60% 50%}
          .fa-archive-folio:after{content:'';position:absolute;inset:28px;background:repeating-linear-gradient(180deg,transparent 0 35px,#D2B98D13 36px,transparent 37px);opacity:.6}
          .fa-archive-folio.two{right:-5%;top:14%;transform:translateZ(-95px) rotateZ(-19deg) skewY(9deg)}.fa-archive-folio.three{right:2%;top:21%;transform:translateZ(-35px) rotateZ(-11deg) skewY(5deg)}
          .fa-archive-light{position:absolute;right:0;top:6%;width:50vw;height:80vh;background:radial-gradient(ellipse,#C295661c,transparent 65%);filter:blur(24px)}
          .fa-archive-bg[data-view=articles] .fa-archive-folio,.fa-archive-bg[data-view=library] .fa-archive-folio{opacity:.6}
          .fa-archive-bg[data-motion=off] .fa-archive-world{transform:none;transition:none}
          body.fa-living-collection>.site-head{background:#081C17f2;backdrop-filter:blur(16px);border-color:var(--fa-quiet-divider)}
          .fa-living-collection .hero-grid>div:first-child{background:transparent;box-shadow:none;border-radius:0}
          .fa-living-collection .section-head,.fa-living-collection .library-note,.fa-living-collection .pullquote{background:#142B21f5;box-shadow:0 0 20px 10px #142B2170}
          .fa-living-collection .catalog-tools,.fa-living-collection .article-card,.fa-living-collection .doctrine-card,.fa-living-collection .book-detail,.fa-living-collection .source-card{background:var(--fa-forest-surface);color:var(--fa-parchment);border-color:var(--fa-quiet-divider)}
          .fa-living-collection .hero-lede,.fa-living-collection .section-intro,.fa-living-collection .article-body p,.fa-living-collection .detail-description,.fa-living-collection .author,.fa-living-collection .article-meta{color:var(--fa-sage-ink)}
          .fa-living-collection .fa-deck{background:radial-gradient(ellipse at 50% 45%,#254B3670,transparent 68%);scrollbar-color:var(--fa-control-edge) var(--fa-archive-depth)}
          .fa-living-collection .fa-deck .catalog-cover{filter:drop-shadow(12px 20px 14px #0009)}
          .fa-living-collection .fa-deck .catalog-book .detail-trigger,.fa-living-collection .fa-deck-controls{background:var(--fa-forest-surface);color:var(--fa-parchment)}
          .fa-living-collection .fa-deck .catalog-book .detail-trigger,.fa-living-collection .fa-deck-controls button,.fa-living-collection .catalog-tools input,.fa-living-collection .catalog-tools select{border-color:var(--fa-control-edge);background:var(--fa-forest-surface);color:var(--fa-parchment)}
          .fa-living-collection .fa-stage-label,.fa-living-collection .serial,.fa-living-collection .section-kicker,.fa-living-collection .catalog-book .order{color:var(--fa-copper)}
          .fa-living-collection .fa-deck-controls button:hover,.fa-living-collection .detail-trigger:hover{border-color:var(--fa-copper);background:var(--fa-folio-layer)}
          .fa-living-collection .btn.primary,#home .hero-actions .btn.primary{background:var(--fa-warm-brass);color:var(--fa-archive-depth);border-color:var(--fa-warm-brass)}
          .fa-living-collection .btn.primary:hover,#home .hero-actions .btn.primary:hover{background:var(--fa-focus-light);color:var(--fa-archive-depth);opacity:1}
          #home .hero-actions .btn:not(.primary){color:var(--fa-parchment)}#home .hero-actions .btn:not(.primary)::after{content:none}
          .fa-living-collection .fa-menu-links{background:var(--fa-forest-surface);color:var(--fa-parchment);border-color:var(--fa-control-edge)}
          .fa-living-collection .fa-menu-links a[aria-current]{color:var(--fa-copper);text-decoration:underline;text-underline-offset:5px}
          #fa-section-menu summary{background:var(--fa-forest-surface);color:var(--fa-parchment);border:1px solid var(--fa-control-edge)}#fa-section-menu summary svg{stroke:currentColor}
          .fa-living-collection .mission-lab,.fa-living-collection .mission-output{background:var(--fa-forest-surface);color:var(--fa-parchment)}.fa-living-collection .mission-lab .section-intro,.fa-living-collection .mission-output p{color:var(--fa-sage-ink)}
          .fa-living-collection .gap-btn{background:var(--fa-forest-surface);color:var(--fa-parchment);border-color:var(--fa-control-edge);border-radius:18px}.fa-living-collection .gap-btn[aria-pressed=true]{background:var(--fa-warm-brass);color:var(--fa-archive-depth);border-color:var(--fa-warm-brass)}.fa-living-collection .mission-output .copy{color:var(--fa-parchment);border-color:var(--fa-control-edge);border-radius:25px}
          html .fa-privacy-panel{background:#142B21;color:#EFE9DA;border-color:#7F947F}html .fa-privacy-panel p,html .fa-privacy-panel label{color:#A6B5A4}html .fa-privacy-panel h2,html .fa-privacy-panel a{color:#EFE9DA}html .fa-privacy-btn{background:#142B21;color:#EFE9DA;border-color:#7F947F}html .fa-privacy-accept{background:#D2B98D;color:#081C17;border-color:#D2B98D}
          .fa-ui-icon{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.fa-deck-controls button{display:grid;place-items:center}.capacity .plus{display:grid;place-items:center}
          .fa-living-collection :is(a,button,input,select,textarea,summary):focus-visible{outline:3px solid var(--fa-focus-light);outline-offset:4px}.fa-living-collection ::selection{background:var(--fa-warm-brass);color:var(--fa-archive-depth)}
          @media(max-width:760px){.fa-archive-folio{width:135vw;min-width:0;height:85vh;right:-62%;top:28%}.fa-archive-folio.two{right:-47%;top:34%}.fa-archive-folio.three{right:-32%;top:40%}.fa-archive-light{width:90vw;right:-20%;top:28%}}
          @media(prefers-reduced-motion:reduce){.fa-archive-world{transform:none!important;transition:none!important}}
          @media(forced-colors:active){.fa-archive-bg{display:none}.fa-living-collection .article-card,.fa-living-collection .catalog-tools,.fa-living-collection .fa-deck-controls{background:Canvas;color:CanvasText}.fa-living-collection .btn.primary{background:ButtonFace;color:ButtonText}.fa-ui-icon{stroke:ButtonText}}

          .fa-living-collection footer{background:var(--fa-archive-depth);color:var(--fa-parchment);border-color:var(--fa-quiet-divider)}.fa-living-collection footer :is(p,span){color:var(--fa-sage-ink)}
          """
          import hashlib,json,re,subprocess,traceback,yaml
          from pathlib import Path
          Path('health').mkdir(exist_ok=True)
          report={'stage':'source','status':'running','physical_iphone':False,'design':'living-collection-v1'}
          try:
              def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              js=Path('fa-studio.js').read_bytes();css=Path('fa-studio.css').read_bytes()
              assert blob(js)=='64e449502742fcec2daafeb236bc9d0a508180f5','Gallery source changed; stop'
              assert blob(css)=='c3791adb02b3e5e43f91b01a3a45b069149428ab','Styles changed; stop'
              text=js.decode();marker="(function(){'use strict';function init(){var grid=";assert text.count(marker)==1
              gallery=text[text.index(marker):]
              index=Path('index.html');html=index.read_text();pattern=r'<script type="application/json" id="catalogData">(.*?)</script>'
              catalog=json.loads(re.search(pattern,html,re.S).group(1))
              covers={b['cover']:hashlib.sha256(Path(b['cover']).read_bytes()).hexdigest() for b in catalog['books']}
              Path('fa-studio.js').write_text(ENVIRONMENT+gallery)
              Path('fa-studio.css').write_text(css.decode()+OVERRIDES)
              html,n=re.subn(r'(<meta name="theme-color" content=")[^"]+("\s*/?>)',r'\g<1>#081C17\2',html,count=1);assert n==1
              index.write_text(html)
              assert json.loads(re.search(pattern,html,re.S).group(1))==catalog
              assert all(hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest for name,digest in covers.items())
              p=Path('sw.js');sw=p.read_text();version=hashlib.sha256((ENVIRONMENT+gallery+css.decode()+OVERRIDES+html).encode()).hexdigest()[:16]
              sw,n=re.subn(r'const VERSION = "[^"]+";','const VERSION = "fa-offline-collection-'+version+'";',sw,count=1);assert n==1;p.write_text(sw)
              subprocess.run(['node','--check','fa-studio.js'],check=True);subprocess.run(['node','--check','sw.js'],check=True)
              source=subprocess.check_output(['git','show','e4fa4850b60257d347e2e8bf0d3dc57ce9c5f79a:.github/workflows/studio-gallery.yml'],text=True)
              steps=yaml.load(source,Loader=yaml.BaseLoader)['jobs']['publish']['steps']
              tests=next(s['run'] for s in steps if s.get('name')=='Execute browser checks and capture screenshots')
              old="page.goto('http://127.0.0.1:8765/',wait_until='networkidle');page.wait_for_selector('.fa-showcase');assert page.locator('.pom-spatial-bg').count()==1"
              assert tests.count(old)==1;indent=re.search(r'(?m)^( +)page.goto',tests).group(1)
              fixed=('\n'+indent).join(["page.goto('http://127.0.0.1:8765/',wait_until='networkidle')","page.get_by_role('button',name='Reject optional',exact=True).click()","page.locator('.fa-privacy-shade').wait_for(state='detached')","page.wait_for_selector('.fa-showcase');assert page.locator('.fa-archive-bg').count()==1","assert page.locator('.pom-vault,.pom-pillar,.pom-floor').count()==0","page.wait_for_function(\"document.querySelectorAll('.fa-deck-controls button svg').length===4\")","assert page.locator('body').evaluate('(e)=>getComputedStyle(e).backgroundColor')=='rgb(8, 28, 23)'","assert page.locator('.fa-deck .catalog-cover').first.evaluate('(e)=>getComputedStyle(e).objectFit')=='contain'"])
              tests=tests.replace(old,fixed,1)
              report['stage']='browser-tests';namespace={'__name__':'__main__'}
              exec(compile(tests,'living-collection-tests','exec'),namespace)
              report.update(status='local_checks_passed',browser_checks=namespace['results'],catalog_preserved=True,covers_preserved=True,gallery_logic_preserved=True,svg_controls=True)
          except BaseException:
              report.update(status='failed',error=traceback.format_exc());raise
          finally:
              Path('health/living-collection-release.json').write_text(json.dumps(report,indent=2))

      - name: Commit tested application update
        id: commit
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fa-studio.js fa-studio.css index.html sw.js health/living-collection-release.json
          git commit -m "Publish original Living Collection environment and approved palette"
          git push origin HEAD:main
      - name: Package public application
        run: |
          mkdir -p /tmp/arkives-collection
          tar --exclude=.git --exclude=.github --exclude=evidence -cf - . | tar -xf - -C /tmp/arkives-collection
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/arkives-collection
      - name: Deploy application
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live updated application
        id: live
        shell: python
        run: |
          import json,time,urllib.request
          from pathlib import Path
          results=[]
          for name in ['fa-studio.js','fa-studio.css','index.html','sw.js']:
              expected=Path(name).read_bytes()
              for attempt in range(12):
                  try:
                      url='https://pomegranatexlily.github.io/freedom-arkives/'+name+'?collection='+str(time.time_ns())
                      if urllib.request.urlopen(url,timeout=30).read()==expected:break
                  except Exception:pass
                  time.sleep(10)
              else:raise AssertionError('Live release mismatch: '+name)
              results.append({'asset':name,'live_bytes_match':True})
          Path('evidence/living-collection-live.json').write_text(json.dumps(results,indent=2))
      - name: Record release result
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('health/living-collection-release.json');p.parent.mkdir(exist_ok=True)
          report=json.loads(p.read_text()) if p.exists() else {}
          report['outcomes']={key:os.environ.get(key,'unknown') for key in ['BUILD','COMMIT','DEPLOY','LIVE']}
          report['run_id']=os.environ['GITHUB_RUN_ID']
          p.write_text(json.dumps(report,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health/living-collection-release.json
          git diff --cached --quiet || git commit -m "Record Living Collection release result"
          git push origin HEAD:main
      - name: Save screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedom-arkives-living-collection-evidence
          path: |
            evidence/
            health/living-collection-release.json
